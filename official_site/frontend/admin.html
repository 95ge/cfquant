<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cfquant.org 管理后台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-body">
  <header class="topbar">
    <a class="brand" href="/" aria-label="返回官网">
      <span class="brand-mark">cf</span>
      <span>
        <strong>cfquant 管理后台</strong>
        <small>/95ge Operations</small>
      </span>
    </a>
    <div class="top-actions">
      <button id="adminRefresh" class="ghost-button" type="button">刷新</button>
      <button id="adminLogout" class="ghost-button hidden" type="button">退出</button>
    </div>
  </header>

  <main class="admin-shell">
    <section id="adminLoginPanel" class="admin-login">
      <div class="section-head">
        <div>
          <p class="eyebrow">Admin</p>
          <h1>后台登录</h1>
          <p>默认入口为 /95ge，管理员账号 root，默认密码 root123456。</p>
        </div>
      </div>
      <form id="adminLoginForm" class="wide-form">
        <label>
          <span>用户名</span>
          <input id="adminUsername" type="text" autocomplete="username" value="root" required>
        </label>
        <label>
          <span>密码</span>
          <input id="adminPassword" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary-button" type="submit">登录</button>
      </form>
    </section>

    <section id="adminWorkspace" class="hidden">
      <div class="section-head">
        <div>
          <p class="eyebrow">Operations</p>
          <h1>运营总览</h1>
          <p>用户、论坛、反馈、点击和下载情况集中查看。</p>
        </div>
      </div>

      <dl id="adminStats" class="stat-grid admin-stats"></dl>

      <div class="admin-grid">
        <section class="admin-panel">
          <div class="panel-head">
            <h2>站点点击</h2>
          </div>
          <div id="topPaths" class="table-wrap"></div>
        </section>
        <section class="admin-panel">
          <div class="panel-head">
            <h2>最近用户</h2>
          </div>
          <div id="recentUsers" class="table-wrap"></div>
        </section>
        <section class="admin-panel">
          <div class="panel-head">
            <h2>最近讨论</h2>
          </div>
          <div id="recentThreads" class="table-wrap"></div>
        </section>
        <section class="admin-panel">
          <div class="panel-head">
            <h2>最新反馈</h2>
          </div>
          <div id="recentFeedback" class="table-wrap"></div>
        </section>
      </div>

      <div class="admin-actions-grid">
        <form id="downloadForm" class="admin-panel admin-form">
          <div class="panel-head">
            <h2>登记更新包</h2>
            <button id="clearDownloadForm" class="ghost-button" type="button">新建</button>
          </div>
          <input id="downloadId" type="hidden">
          <label>
            <span>标题</span>
            <input id="downloadTitle" type="text" value="cfquant 更新包" required>
          </label>
          <label>
            <span>版本</span>
            <input id="downloadVersion" type="text" placeholder="例如 core_20260818_01" required>
          </label>
          <label>
            <span>本地文件名</span>
            <input id="downloadFile" type="text" placeholder="放入 official_site/packages 后填写">
          </label>
          <label>
            <span>外部链接</span>
            <input id="downloadUrl" type="url" placeholder="GitHub 或网盘链接">
          </label>
          <label>
            <span>说明</span>
            <textarea id="downloadNotes" rows="4"></textarea>
          </label>
          <button class="primary-button" type="submit">保存更新包</button>
        </form>

        <form id="broadcastForm" class="admin-panel admin-form">
          <div class="panel-head">
            <h2>发送站内通知</h2>
          </div>
          <label>
            <span>标题</span>
            <input id="broadcastTitle" type="text" required>
          </label>
          <label>
            <span>内容</span>
            <textarea id="broadcastBody" rows="7" required></textarea>
          </label>
          <button class="primary-button" type="submit">发送给全部用户</button>
        </form>
      </div>

      <div class="admin-grid full">
        <section class="admin-panel">
          <div class="panel-head">
            <h2>更新包管理</h2>
            <button id="loadDownloads" class="ghost-button" type="button">加载</button>
          </div>
          <div id="downloadTable" class="table-wrap"></div>
        </section>
        <section class="admin-panel">
          <div class="panel-head">
            <h2>用户管理</h2>
            <button id="loadUsers" class="ghost-button" type="button">加载</button>
          </div>
          <div id="userTable" class="table-wrap"></div>
        </section>
        <section class="admin-panel">
          <div class="panel-head">
            <h2>讨论管理</h2>
            <button id="loadThreads" class="ghost-button" type="button">加载</button>
          </div>
          <div id="threadTable" class="table-wrap"></div>
        </section>
        <section class="admin-panel">
          <div class="panel-head">
            <h2>反馈处理</h2>
            <button id="loadFeedback" class="ghost-button" type="button">加载</button>
          </div>
          <div id="feedbackTable" class="table-wrap"></div>
        </section>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script src="/config.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
